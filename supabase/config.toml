# Tajdeed (تجديد) — linked to remote project crm-dev (hwmexwnzirwpfotgtsmu)
project_id = "tajdeed"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.pooler]
enabled = false
default_pool_size = 15
max_client_conn = 200

[auth]
enabled = true
site_url = "https://tajdeed-jade.vercel.app"
additional_redirect_urls = [
  "http://localhost:3210/**",
  "https://tajdeed-jade.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 10
enable_anonymous_sign_ins = false

# Email/password logins must stay enabled for staff accounts.
# New public signups remain blocked via [auth].enable_signup = false.
[auth.email]
enabled = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 8

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true

[storage.vector]
enabled = false
